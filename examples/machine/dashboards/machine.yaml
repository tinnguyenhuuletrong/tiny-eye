# Dashboard "This Mac": saved by tiny-eye. This file is the source of truth; commit it.
# Each panel: `ui` (display, unit, w of 12 columns, h rows) and `query` (TQS).
id: machine
title: This Mac
panels:
- ui:
    display: stat
    unit: '%'
    w: 3
    h: 2
  query:
    tqs: '3'
    id: cpu-now
    kind: timeseries
    title: CPU busy
    time:
      from: -15m
      step: 15s
    queries:
    - name: busy
      hidden: true
      metric: system_cpu_utilization
      match:
      - label: state
        op: '!='
        value: idle
      fn:
        op: last
      agg:
        op: sum
    formulas:
    - name: pct
      expr: 100 * busy
- ui:
    display: stat
    unit: '%'
    w: 3
    h: 2
  query:
    tqs: '3'
    id: mem-now
    kind: timeseries
    title: Memory used
    time:
      from: -15m
      step: 15s
    queries:
    - name: mem
      hidden: true
      metric: system_memory_utilization
      fn:
        op: last
      agg:
        op: max
    formulas:
    - name: pct
      expr: 100 * mem
- ui:
    display: stat
    unit: load
    w: 3
    h: 2
  query:
    tqs: '3'
    id: load-now
    kind: timeseries
    title: Load (1 m)
    time:
      from: -15m
      step: 15s
    queries:
    - name: load
      metric: system_cpu_load_average_1m
      fn:
        op: last
      agg:
        op: max
- ui:
    display: stat
    unit: '%'
    w: 3
    h: 2
  query:
    tqs: '3'
    id: disk-now
    kind: timeseries
    title: Disk used (fullest)
    time:
      from: -15m
      step: 15s
    queries:
    - name: disk
      hidden: true
      metric: system_filesystem_utilization
      fn:
        op: last
      agg:
        op: max
    formulas:
    - name: pct
      expr: 100 * disk
- ui:
    display: timeseries
    unit: '%'
    w: 6
    h: 4
  query:
    tqs: '3'
    id: cpu-state
    kind: timeseries
    title: CPU by state
    time:
      from: -15m
      step: 15s
    queries:
    - name: cpu
      hidden: true
      metric: system_cpu_utilization
      match:
      - label: state
        op: '!='
        value: idle
      fn:
        op: last
      agg:
        op: sum
        by:
        - state
    formulas:
    - name: pct
      expr: 100 * cpu
- ui:
    display: timeseries
    unit: bytes
    w: 6
    h: 4
  query:
    tqs: '3'
    id: mem-used
    kind: timeseries
    title: Memory
    time:
      from: -15m
      step: 15s
    queries:
    - name: mem
      metric: system_memory_usage
      fn:
        op: last
      agg:
        op: sum
        by:
        - state
- ui:
    display: timeseries
    unit: load
    w: 6
    h: 4
  query:
    tqs: '3'
    id: load
    kind: timeseries
    title: Load average
    time:
      from: -15m
      step: 15s
    queries:
    - name: load_1m
      metric: system_cpu_load_average_1m
      fn:
        op: last
      agg:
        op: max
    - name: load_5m
      metric: system_cpu_load_average_5m
      fn:
        op: last
      agg:
        op: max
    - name: load_15m
      metric: system_cpu_load_average_15m
      fn:
        op: last
      agg:
        op: max
- ui:
    display: timeseries
    unit: bytes/s
    w: 6
    h: 4
  query:
    tqs: '3'
    id: net
    kind: timeseries
    title: Network throughput
    time:
      from: -15m
      step: 15s
    queries:
    - name: net
      metric: system_network_io_total
      fn:
        op: rate
        window: 1m
      agg:
        op: sum
        by:
        - direction
- ui:
    display: bar
    unit: '%'
    w: 6
    h: 4
  query:
    tqs: '3'
    id: disk
    kind: timeseries
    title: Disk utilization by mount
    time:
      from: -15m
      step: 15s
    queries:
    - name: disk
      hidden: true
      metric: system_filesystem_utilization
      fn:
        op: last
      agg:
        op: max
        by:
        - mountpoint
    formulas:
    - name: pct
      expr: 100 * disk
- ui:
    display: timeseries
    unit: bytes
    w: 6
    h: 4
  query:
    tqs: '3'
    id: disk-bytes
    kind: timeseries
    title: Disk space
    time:
      from: -15m
      step: 15s
    queries:
    - name: disk
      metric: system_filesystem_usage
      fn:
        op: last
      agg:
        op: sum
        by:
        - state
- ui:
    display: timeseries
    unit: cores
    w: 6
    h: 4
  query:
    tqs: '3'
    id: top-cpu
    kind: timeseries
    title: Busiest processes (CPU, 1.0 = one core)
    time:
      from: -5m
      step: 10s
    queries:
    - name: cpu
      metric: process_cpu_utilization
      fn:
        op: last
      agg:
        op: max
        by:
        - process_name
        - pid
    top:
      n: 5
      rank: per_step
- ui:
    display: timeseries
    unit: bytes
    w: 6
    h: 4
  query:
    tqs: '3'
    id: top-mem
    kind: timeseries
    title: Biggest processes (memory)
    time:
      from: -5m
      step: 10s
    queries:
    - name: mem
      metric: process_memory_usage
      fn:
        op: last
      agg:
        op: max
        by:
        - process_name
        - pid
    top:
      n: 5
      rank: per_step
