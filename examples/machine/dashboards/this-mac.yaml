# Dashboard "This Mac": saved by tiny-eye. This file is the source of truth; commit it.
# Each panel: `ui` (display, unit, w of 12 columns, h rows) and `query` (TQS).
id: this-mac
title: This Mac
panels:
- ui:
    display: stat
    unit: '%'
    w: 3
    h: 2
  query:
    tqs: '3'
    id: cpu_now
    kind: timeseries
    time:
      from: -5m
      step: 15s
    queries:
    - name: busy
      hidden: true
      metric: system_cpu_utilization
      match:
      - label: state
        op: '!='
        value: idle
      fn:
        op: last
      agg:
        op: sum
    formulas:
    - name: cpu_busy
      expr: 100 * busy
- ui:
    display: stat
    unit: '%'
    w: 3
    h: 2
  query:
    tqs: '3'
    id: mem_now
    kind: timeseries
    time:
      from: -5m
      step: 15s
    queries:
    - name: m
      hidden: true
      metric: system_memory_utilization
      fn:
        op: last
      agg:
        op: max
    formulas:
    - name: mem_used
      expr: 100 * m
- ui:
    display: stat
    unit: ''
    w: 3
    h: 2
  query:
    tqs: '3'
    id: load_now
    kind: timeseries
    time:
      from: -5m
      step: 15s
    queries:
    - name: load_1m
      metric: system_cpu_load_average_1m
      fn:
        op: last
      agg:
        op: max
- ui:
    display: stat
    unit: '%'
    w: 3
    h: 2
  query:
    tqs: '3'
    id: disk_now
    kind: timeseries
    time:
      from: -5m
      step: 15s
    queries:
    - name: d
      hidden: true
      metric: system_filesystem_utilization
      fn:
        op: last
      agg:
        op: max
    formulas:
    - name: disk_used
      expr: 100 * d
- ui:
    display: timeseries
    unit: '%'
    w: 6
    h: 4
  query:
    tqs: '3'
    id: cpu
    kind: timeseries
    time:
      from: -15m
      step: 15s
    queries:
    - name: u
      hidden: true
      metric: system_cpu_utilization
      fn:
        op: last
      agg:
        op: sum
        by:
        - state
    formulas:
    - name: cpu
      expr: 100 * u
- ui:
    display: timeseries
    unit: bytes
    w: 6
    h: 4
  query:
    tqs: '3'
    id: mem
    kind: timeseries
    time:
      from: -15m
      step: 15s
    queries:
    - name: memory
      metric: system_memory_usage
      fn:
        op: last
      agg:
        op: sum
        by:
        - state
- ui:
    display: timeseries
    unit: ''
    w: 6
    h: 4
  query:
    tqs: '3'
    id: load
    kind: timeseries
    time:
      from: -15m
      step: 15s
    queries:
    - name: load_1m
      metric: system_cpu_load_average_1m
      fn:
        op: last
      agg:
        op: max
    - name: load_5m
      metric: system_cpu_load_average_5m
      fn:
        op: last
      agg:
        op: max
    - name: load_15m
      metric: system_cpu_load_average_15m
      fn:
        op: last
      agg:
        op: max
- ui:
    display: timeseries
    unit: bytes
    w: 6
    h: 4
  query:
    tqs: '3'
    id: net
    kind: timeseries
    time:
      from: -15m
      step: 15s
    queries:
    - name: bytes_per_s
      metric: system_network_io_total
      fn:
        op: rate
        window: 1m
      agg:
        op: sum
        by:
        - direction
- ui:
    display: bar
    unit: bytes
    w: 6
    h: 4
  query:
    tqs: '3'
    id: disk
    kind: table
    time:
      from: -5m
      step: 15s
    queries:
    - name: disk
      metric: system_filesystem_usage
      fn:
        op: last
      agg:
        op: max
        by:
        - state
- ui:
    display: timeseries
    unit: ''
    w: 6
    h: 4
  query:
    tqs: '3'
    id: top_cpu
    kind: timeseries
    time:
      from: -5m
      step: 10s
    queries:
    - name: cpu
      metric: process_cpu_utilization
      fn:
        op: last
      agg:
        op: max
        by:
        - process_name
        - pid
    top:
      n: 5
      rank: per_step
- ui:
    display: table
    unit: bytes
    w: 6
    h: 4
  query:
    tqs: '3'
    id: top_mem
    kind: table
    time:
      from: -2m
      step: 10s
    queries:
    - name: rss
      metric: process_memory_usage
      fn:
        op: last
      agg:
        op: max
        by:
        - process_name
        - pid
    top:
      n: 8
      rank: per_step
