[package]
name = "tqs"
description = "TQS 3: the declarative JSON query schema, its validator and its DuckDB SQL compiler (SPEC §8)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# Compiles the mutation switches used only by the conformance suite.
mutants = []

[dependencies]
anyhow.workspace = true
duckdb.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
arrow.workspace = true
parquet.workspace = true
rand.workspace = true
ureq.workspace = true
xxhash-rust.workspace = true
bytes.workspace = true
serde_json.workspace = true

# Point-by-point equality against Prometheus 3.16 + validation + mutation check.
# Needs .tools/prometheus and .tools/promtool: run through `make conformance`.
[[test]]
name = "conformance"
path = "tests/conformance/main.rs"
harness = false
required-features = ["mutants"]

[lints]
workspace = true
