[package]
name = "server"
description = "tiny-eye binary: HTTP API (generated from api/openapi.yaml), ingest receivers, MCP bridge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "tiny-eye"
path = "src/main.rs"

[[bin]]
name = "tiny-eye-bench"
path = "src/bin/bench.rs"

[dependencies]
engine.workspace = true
tqs.workspace = true
anyhow.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
prost.workspace = true
snap.workspace = true
opentelemetry-proto.workspace = true
ureq.workspace = true
flate2 = "1"
rand.workspace = true
# used by the tiny-eye-bench binary
tempfile.workspace = true
ulid.workspace = true

[dev-dependencies]
jsonschema = { version = "0.62", default-features = false }
serde_norway.workspace = true
duckdb.workspace = true

[build-dependencies]
serde_json.workspace = true
serde_norway.workspace = true

[lints]
workspace = true
