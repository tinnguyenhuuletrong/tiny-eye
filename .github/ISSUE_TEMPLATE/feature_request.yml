name: Feature request
description: Propose a new capability or a change in behaviour.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        tiny-eye aims to stay small: one binary, three crates, behaviour driven by config.
        Explain the problem first; the smallest design that solves it wins.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: What should tiny-eye do? Example TQS documents, config keys or API calls help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other ways to solve it, including outside tiny-eye.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Ingest (remote-write, OTLP, Loki)
        - Storage, compaction, retention
        - TQS query language
        - HTTP API / MCP
        - Dashboards / UI
        - Configuration / deployment
        - Docs
        - Other
    validations:
      required: true
