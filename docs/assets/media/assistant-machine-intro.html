<!doctype html>
<!-- Title card of docs/assets/assistant-machine.{gif,mp4}: node docs/assets/media/record.mjs assistant-machine -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>tiny-assistant × tiny-eye</title>
<style>
  @font-face { font-family: Geist; src: url(../../../ui/node_modules/@fontsource-variable/geist/files/geist-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "Geist Mono"; src: url(../../../ui/node_modules/@fontsource-variable/geist-mono/files/geist-mono-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
  html, body { margin: 0; width: 1602px; height: 900px; overflow: hidden; background: radial-gradient(1100px 650px at 30% 10%, #141a26 0%, #0b0d12 62%); color: #e8eaf0; font-family: Geist, -apple-system, sans-serif; }
  main { position: absolute; left: 120px; top: 250px; }
  .eyebrow { font: 600 15px "Geist Mono", monospace; letter-spacing: .12em; text-transform: uppercase; color: #5eead4; }
  h1 { margin: 18px 0 0; font-size: 68px; font-weight: 600; letter-spacing: -0.03em; }
  h1 span { color: #8b93a5; font-weight: 400; }
  p { margin: 18px 0 0; font-size: 26px; color: #b7bdcb; max-width: 1100px; line-height: 1.4; }
  ol { margin: 56px 0 0; padding: 0; list-style: none; display: flex; gap: 18px; }
  li { padding: 14px 20px; border: 1px solid #262c39; border-radius: 12px; background: #10131a; font-size: 19px; color: #e8eaf0; }
  li b { color: #5eead4; font: 600 15px "Geist Mono", monospace; margin-right: 10px; }
  .fade { opacity: 0; transform: translateY(8px); }
</style>
</head>
<body>
<main>
  <div class="eyebrow fade" id="e">Demo</div>
  <h1 class="fade" id="h">tiny-assistant <span>×</span> tiny-eye</h1>
  <p class="fade" id="p">A personal AI assistant that watches this Mac through tiny-eye, builds its dashboard, acts on what it sees, and watches itself.</p>
  <ol>
    <li class="fade" id="s1"><b>1</b>Start watching the machine</li>
    <li class="fade" id="s2"><b>2</b>Build a dashboard</li>
    <li class="fade" id="s3"><b>3</b>Find and stop a runaway process</li>
    <li class="fade" id="s4"><b>4</b>Check its own cost and tool calls</li>
  </ol>
</main>
<script>
const L = 4.5;
const ease = (x) => 1 - Math.pow(1 - Math.max(0, Math.min(1, x)), 3);
const items = [["e", 0.1], ["h", 0.25], ["p", 0.55], ["s1", 1.1], ["s2", 1.35], ["s3", 1.6], ["s4", 1.85]];
function render(t) {
  for (const [id, at] of items) {
    const k = ease((t - at) / 0.5);
    const e = document.getElementById(id);
    e.style.opacity = k * (1 - ease((t - (L - 0.4)) / 0.4));
    e.style.transform = `translateY(${(1 - k) * 8}px)`;
  }
}
window.render = render;
window.LOOP_SECONDS = L;
if (!new URLSearchParams(location.search).has("still")) {
  const t0 = performance.now();
  const tick = () => { render(((performance.now() - t0) / 1000) % L); requestAnimationFrame(tick); };
  document.fonts.ready.then(tick);
} else render(0);
</script>
</body>
</html>
