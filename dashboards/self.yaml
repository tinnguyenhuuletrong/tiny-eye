# yaml-language-server: $schema=../schema/generated/dashboard.schema.json
# The engine watching itself. Empty until a Prometheus or Alloy agent scrapes tiny-eye's /metrics
# with job="tiny-eye" and remote-writes it to /api/v1/write (docs/examples/sending-data.md).
id: tiny-eye-self
title: tiny-eye self-monitoring
vars:
  job: tiny-eye
panels:
  - ui: { display: timeseries, unit: rows/s, w: 9, h: 4 }
    query:
      tqs: "3"
      id: ingest-rate
      title: Ingested rows per second by table
      kind: timeseries
      time: { from: "-1h", step: "1m" }
      queries:
        - name: r
          metric: tiny_eye_ingested_rows_total
          match: [{ label: job, op: "=", value: "$job" }]
          fn: { op: rate, window: 5m }
          agg: { op: sum, by: [table] }
  - ui: { display: stat, unit: bytes, w: 3, h: 2 }
    query:
      tqs: "3"
      id: hot-bytes
      title: Hot tail size
      kind: table
      time: { from: "-5m" }
      queries:
        - name: b
          metric: tiny_eye_hot_bytes
          match: [{ label: job, op: "=", value: "$job" }]
          fn: { op: last }
          agg: { op: sum }
          fill: zero
